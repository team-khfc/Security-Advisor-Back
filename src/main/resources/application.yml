# 기본 설정. 환경마다 다른 값은 환경변수로 덮어쓴다. 로컬에서는 `cp .env.example .env` 로 만든 .env 를 아래 config.import 가 읽는다.
spring:
  application:
    name: securityadvisor
  servlet:
    multipart:
      # F-02 업로드 한도(기획서·사업계획서·기능명세서·개요서)
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    # .env 가 있으면 환경변수처럼 읽는다(없어도 됨). .env 는 커밋하지 않는다.
    import: optional:file:.env[.properties]
  profiles:
    # 프로필을 지정하지 않고 실행하면 local 로 동작한다. 서버·도커에서는 SPRING_PROFILES_ACTIVE 로 지정.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boan}
    username: ${DB_USERNAME:boan}
    password: ${DB_PASSWORD:boan}
  jpa:
    # 뷰 렌더링 중 지연 로딩 금지. 필요한 데이터는 서비스 계층에서 모두 조회한다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. JPA 는 엔티티와 테이블이 맞는지만 확인한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # 시연용 세션 만료 시간. 만료 후 요청은 401 ProblemDetail 로 응답한다 (design.md 11장 세션 만료 안내).
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        # 세션 쿠키는 HttpOnly + SameSite=Lax. HTTPS 로 서비스할 때 SESSION_COOKIE_SECURE=true (SECURE_CODING.md 2절).
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

securityadvisor:
  installation:
    # 운영 기관(설치당 1곳). 기관 테이블 없음 — 설정값만 (FUNCTIONAL_SPEC 3-4장)
    name: ${INSTITUTION_NAME:합성 시연 기관}
    code: ${INSTITUTION_CODE:DEMO}
  demo:
    # 시연 계정 공통 비밀번호. 환경변수로만 받는다 — 비어 있으면 시연 계정을 만들지 않는다 (F-11).
    account-password: ${DEMO_ACCOUNT_PASSWORD:}
  auth:
    # 로그인 실패 제한: 연속 N회 실패 시 잠금, 잠금 시간 (SECURE_CODING.md 2절)
    max-failed-logins: ${LOGIN_MAX_FAILURES:5}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}
  notification:
    # 외부 알림 채널(F-17 P3). 값이 비어 있으면 그 채널은 꺼지고 화면 안 알림만 남는다. 비밀값은 환경변수로만.
    webhook:
      url: ${NOTIFY_WEBHOOK_URL:}
      timeout-seconds: 5
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:25}
      starttls: ${SMTP_STARTTLS:false}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
      timeout-seconds: 10
  storage:
    # 업로드 파일 저장 폴더(서버 생성 파일명 UUID). Docker 에서는 볼륨으로 마운트
    dir: ${STORAGE_DIR:./storage}
  llm:
    allowed-key-envs: ${LLM_ALLOWED_KEY_ENVS:OPENAI_API_KEY,OPENROUTER_API_KEY,OLLAMA_API_KEY}
    # live: llm_configurations 의 활성 구성으로 실제 모델 호출 / fake: 네트워크 없이 고정 응답(테스트·오프라인 시연)
    mode: ${LLM_MODE:live}
    # 등록 가능한 엔드포인트 호스트 허용 목록(SSRF 방지, F-10). 쉼표 구분
    allowed-hosts: ${LLM_ALLOWED_HOSTS:api.openai.com,openrouter.ai,ollama,localhost,host.docker.internal}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
