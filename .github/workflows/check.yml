name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest  # Docker 포함 — Testcontainers(PostgreSQL) 테스트가 돈다
    steps:
      - uses: actions/checkout@v4
      - name: 프로젝트 문서 버전·경로 검사
        run: python3 tools/check_doc_versions.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless + 컴파일 + 테스트 + ArchUnit
        # Windows 에서 커밋된 저장소라 실행 비트가 빠질 수 있어 한 번 더 보장한다
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon --console=plain
      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
